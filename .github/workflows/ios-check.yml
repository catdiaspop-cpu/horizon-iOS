name: iOS compile check

# A fast check that the game still builds for iOS (Metal), without Mojang's files: the IPA
# workflow (build-ios.yml) fetches and prepares those, which takes minutes and a Java 25
# toolchain. This one only compiles, so a broken `cfg(target_os = "ios")` shows up in minutes.
# Compiler errors are also emitted as annotations, which the checks API serves.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/ios/**"
      - ".github/workflows/ios-check.yml"
  push:
    branches: ["android-port", "main", "master"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/ios/**"
      - ".github/workflows/ios-check.yml"

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain and the iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ios-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-check-

      - name: cargo check (aarch64-apple-ios)
        run: |
          set -o pipefail
          cargo check --profile dev --target aarch64-apple-ios \
            -p horizon-client --bin horizon-client \
            --no-default-features --features audio 2>&1 | tee check.log

      # The Actions log download goes to a host some clients can't reach; annotations come
      # from the checks API instead, so the first errors are readable anywhere.
      - name: Upload the log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-check-logs
          path: check.log
          if-no-files-found: ignore

      - name: Annotate the first errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          log = open("check.log", encoding="utf-8", errors="replace").read().splitlines()
          # Cargo's own "error: could not compile" lines and the compiler's span lines.
          errors = [l for l in log if re.match(r"^\s*(error(\[E\d+\])?:|--> )", l)]
          for line in errors[:40]:
              line = line.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::{line}")
          print(f"{len(errors)} line(s) matched 'error'; {len(log)} log line(s) total")
          PY
          tail -n 40 check.log || true

      - name: Note a stale Cargo.lock
        if: always()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "::warning file=Cargo.lock::Cargo.lock changed during the build; commit it"
            git diff --stat -- Cargo.lock
          fi
