name: runner probe
# Temporary: which macOS runner labels GitHub starts for this fork, and how fast.
on:
  pull_request:
    paths:
      - ".github/workflows/runner-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -a; xcodebuild -version; rustc --version || true
