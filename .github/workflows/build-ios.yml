name: Build Horizon iOS (Metal & Touch)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Fetch Latest Code from Upstream (Rayan-XOO)
        uses: actions/checkout@v4
        with:
          repository: 'Rayan-XOO/horizon'
          ref: 'android-port'

      - name: Route Graphics to Metal & Enable Touch UI
        run: |
          # 1. Отключаем Vulkan и перенаправляем графический движок wgpu на нативный Metal для iOS
          sed -i '' 's/target_os = "macos"/any(target_os = "macos", target_os = "ios")/g' crates/horizon-hdr/Cargo.toml
          sed -i '' 's/target_os = "macos"/any(target_os = "macos", target_os = "ios")/g' crates/horizon-hdr/src/lib.rs
          sed -i '' 's/target_os = "macos"/any(target_os = "macos", target_os = "ios")/g' crates/horizon-client-render/Cargo.toml
          sed -i '' 's/target_os = "macos"/any(target_os = "macos", target_os = "ios")/g' crates/horizon-client-render/src/gfx.rs

          # 2. Включаем сенсорный джойстик и кнопки Bedrock под пальцы
          sed -i '' 's/cfg!(target_os = "android")/cfg!(any(target_os = "android", target_os = "ios"))/g' crates/horizon-client/src/game/touch.rs

      - name: Setup Rust & iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Compile Horizon for iOS with Metal
        run: |
          cargo build --release --target aarch64-apple-ios -p horizon-client --bin horizon-client

      - name: Package into IPA Bundle
        run: |
          mkdir -p Payload/Horizon.app
          cp target/aarch64-apple-ios/release/horizon-client Payload/Horizon.app/Horizon
          chmod +x Payload/Horizon.app/Horizon

          VERSION=$(grep -m1 'version =' Cargo.toml | cut -d '"' -f2 || echo "0.4.5")

          cat << EOF > Payload/Horizon.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Horizon</string>
              <key>CFBundleIdentifier</key>
              <string>dev.horizonlab.horizon</string>
              <key>CFBundleName</key>
              <string>Horizon</string>
              <key>CFBundleDisplayName</key>
              <string>Horizon</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
                  <string>metal</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - Payload/Horizon.app
          zip -r Horizon.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-Metal
          path: Horizon.ipa
