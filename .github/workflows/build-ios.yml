name: Build Horizon iOS (.ipa)

# Builds the game for iOS on Apple silicon: Metal through wgpu, no patches applied at build
# time. The platform is part of the source (`cfg(target_os = "ios")` beside the Android ones),
# so what CI builds is what the repository says, byte for byte. See IOS.md.
on:
  workflow_dispatch:
  push:
    branches: ["android-port", "main", "master"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java 25 (horizon-prepare's exporters)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Install Rust toolchain and the iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      - name: Fetch Minecraft 26.3 files
        run: python3 packaging/ios/fetch_assets.py .minecraft

      - name: Prepare the game's resources
        run: >-
          cargo run --release -p horizon-prepare --
          --prepare --minecraft-dir .minecraft --server-jar server.jar

      - name: Build the app and package the IPA
        run: ./packaging/ios/build_ipa.sh

      - name: Upload Horizon.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS
          path: target/ios/Horizon.ipa
          if-no-files-found: error
