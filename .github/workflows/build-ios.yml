name: Build Horizon iOS (Metal & Touch)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Fetch Latest Code from Upstream (Rayan-XOO)
        uses: actions/checkout@v4
        with:
          repository: 'Rayan-XOO/horizon'
          ref: 'android-port'

      - name: Route Graphics to Metal & Enable Touch UI
        run: |
          echo "=== 1. Убираем arboard и wayland (включаем мобильный буфер обмена для iOS) ==="
          sed -i '' 's/cfg(not(target_os = "android"))/cfg(not(any(target_os = "android", target_os = "ios")))/g' crates/horizon-client-input/Cargo.toml
          sed -i '' 's/cfg(target_os = "android")/cfg(any(target_os = "android", target_os = "ios"))/g' crates/horizon-client-input/src/clipboard.rs
          sed -i '' 's/cfg(target_os = "android")/cfg(any(target_os = "android", target_os = "ios"))/g' crates/horizon-client-input/src/keybinds.rs
          sed -i '' 's/cfg(not(target_os = "android"))/cfg(not(any(target_os = "android", target_os = "ios")))/g' crates/horizon-client-input/src/keybinds.rs

          echo "=== 2. Оптимизируем настройки графики под мобильный экран (fit_phone) ==="
          sed -i '' 's/cfg(target_os = "android")/cfg(any(target_os = "android", target_os = "ios"))/g' crates/horizon-client-render/src/settings.rs
          sed -i '' 's/cfg(not(target_os = "android"))/cfg(not(any(target_os = "android", target_os = "ios")))/g' crates/horizon-client-render/src/settings.rs

          echo "=== 3. Отключаем OpenGL ES во всех крейтах для iOS ==="
          find crates -name "Cargo.toml" -exec sed -i '' 's/cfg(not(target_os = "macos"))/cfg(not(any(target_os = "macos", target_os = "ios")))/g' {} +

          echo "=== 4. Отключаем Vulkan и ash в horizon-hdr ==="
          sed -i '' 's/features = \["vulkan"\]/features = []/g' crates/horizon-hdr/Cargo.toml
          sed -i '' 's/cfg(not(target_os = "macos"))/cfg(not(any(target_os = "macos", target_os = "ios")))/g' crates/horizon-hdr/src/lib.rs
          sed -i '' 's/cfg(target_os = "macos")/cfg(any(target_os = "macos", target_os = "ios"))/g' crates/horizon-hdr/src/lib.rs

          echo "=== 5. Направляем рендер на Metal и устраняем дублирование констант ==="
          sed -i '' 's/cfg(not(target_os = "macos"))/cfg(not(any(target_os = "macos", target_os = "ios")))/g' crates/horizon-client-render/src/gfx.rs
          sed -i '' 's/cfg(target_os = "macos")/cfg(any(target_os = "macos", target_os = "ios"))/g' crates/horizon-client-render/src/gfx.rs
          sed -i '' 's/cfg(not(any(target_os = "windows", target_os = "macos")))/cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))/g' crates/horizon-client-render/src/gfx.rs

          echo "=== 6. Отключаем захват курсора мыши на iOS ==="
          sed -i '' 's/cfg(not(any(target_os = "macos", target_os = "windows", target_os = "android")))/cfg(not(any(target_os = "macos", target_os = "windows", target_os = "android", target_os = "ios")))/g' crates/horizon-client/src/game.rs

          echo "=== 7. Включаем сенсорное управление Bedrock (джойстик, прыжок, присед, хотбар) ==="
          sed -i '' 's/cfg!(target_os = "android")/cfg!(any(target_os = "android", target_os = "ios"))/g' crates/horizon-client/src/game/touch.rs

      - name: Setup Rust & iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Compile Horizon for iOS with Metal
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export IPHONEOS_DEPLOYMENT_TARGET=16.0

          echo "Начинаем компиляцию Horizon Client под iOS Metal..."
          cargo build --release --target aarch64-apple-ios -p horizon-client --bin horizon-client 2>&1 | tee cargo_build.log || {
            echo "## ❌ Ошибка компиляции Rust" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 cargo_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Package into IPA Bundle
        run: |
          mkdir -p Payload/Horizon.app
          cp target/aarch64-apple-ios/release/horizon-client Payload/Horizon.app/Horizon
          chmod +x Payload/Horizon.app/Horizon

          VERSION=$(grep -m1 'version =' Cargo.toml | cut -d '"' -f2 || echo "0.4.5")

          cat << 'EOF' > Payload/Horizon.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Horizon</string>
              <key>CFBundleIdentifier</key>
              <string>dev.horizonlab.horizon</string>
              <key>CFBundleName</key>
              <string>Horizon</string>
              <key>CFBundleDisplayName</key>
              <string>Horizon</string>
              <key>CFBundleVersion</key>
              <string>0.4.5</string>
              <key>CFBundleShortVersionString</key>
              <string>0.4.5</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
                  <string>metal</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - Payload/Horizon.app
          zip -r Horizon.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-Metal
          path: Horizon.ipa
