name: Build Horizon iOS (.ipa)

# Builds the game for iOS on Apple silicon: Metal through wgpu, no patches applied at build
# time. The platform is part of the source (`cfg(target_os = "ios")` beside the Android ones),
# so what CI builds is what the repository says, byte for byte. See IOS.md.
#
# Run it from the Actions tab (Workflow "Build Horizon iOS (.ipa)" -> Run workflow). A workflow
# only shows that button when this file is on the default branch; before then, open the pull
# request's Checks tab and press "Re-run jobs".
on:
  workflow_dispatch:
  push:
    branches: ["android-port", "main", "master"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # `macos-15-intel`, not `macos-15`: GitHub's arm64 macOS fleet is quota-governed and these
    # jobs sat waiting for a runner ("The job was not acquired by Runner ... capacity
    # constraints"). The Intel image cross-compiles the same arm64 device binary and has 14 GB
    # of RAM instead of 7, which the asset prepare and the build both use.
    runs-on: macos-15-intel
    env:
      # The version `packaging/ios/build_ipa.sh` links for: the check and the build must compile
      # the dependencies' C code (ring, and mimalloc before iOS dropped it) for the same one.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java 25 (horizon-prepare's exporters)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Install Rust toolchain and the iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      # Before the slow part: Mojang's ~525 MB and horizon-prepare take ten minutes, and a
      # broken `cfg(target_os = "ios")` should not wait for them.
      - name: Compile check first
        run: |
          set -o pipefail
          cargo check --target aarch64-apple-ios \
            -p horizon-client --bin horizon-client \
            --no-default-features --features audio 2>&1 | tee check.log

      - name: Free the room the build needs
        run: |
          df -h /
          # The check's dev artifacts are never used again: the release build wants the disk.
          rm -rf target/debug

      - name: Fetch Minecraft 26.3 files
        run: python3 packaging/ios/fetch_assets.py .minecraft

      - name: Prepare the game's resources
        run: >-
          cargo run --release -p horizon-prepare --
          --prepare --minecraft-dir .minecraft --server-jar server.jar

      - name: Build the app and package the IPA
        env:
          # `fast` is release code without thin LTO and with 16 codegen units: the shipped IPA
          # wants `release`, but a CI loop on 3-4 cores cannot spend 40 minutes in one link, and
          # the runner's 14 GB cannot hold its temporaries.
          PROFILE: fast
          # The bundle takes the prepared folder instead of a copy of it.
          HORIZON_IOS_MOVE_RESOURCES: "1"
        run: |
          set -o pipefail
          rm -rf .minecraft
          df -h /
          ./packaging/ios/build_ipa.sh 2>&1 | tee build.log
          df -h /

      - name: Upload Horizon.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS
          path: target/ios/Horizon.ipa
          if-no-files-found: error

      - name: Annotate the first errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          lines = []
          for name in ("build.log", "check.log"):
              try:
                  lines += open(name, encoding="utf-8", errors="replace").read().splitlines()
              except OSError:
                  pass
          summary = []
          errors = [l for l in lines if re.match(r"^\s*(error(\[E\d+\])?:|--> |warning: unused)", l)]
          summary += errors[-40:]
          summary += ["", "last 40 lines:"] + lines[-40:]
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as out:
              out.write("```\n" + "\n".join(summary) + "\n```\n")
          for line in errors[:40]:
              print("::error::" + line.replace("%", "%25").replace("\r", ""))
          print(f"{len(errors)} error line(s) in {len(lines)} log line(s)")
          for line in lines[-40:]:
              print(line)
          PY

      - name: Note a stale Cargo.lock
        if: always()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "::warning file=Cargo.lock::Cargo.lock changed during the build; commit it"
            git diff --stat -- Cargo.lock
          fi
