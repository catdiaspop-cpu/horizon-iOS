[package]
name = "horizon-hdr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "HDR metadata for the swapchain: the Vulkan calls the crates that forbid unsafe code can't make"

[dependencies]
# The wgpu types only: no backend is linked in here, so the crate builds for every
# target the game does (Metal on macOS and iOS included).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
# `VK_EXT_hdr_metadata`, the only place a swapchain's luminance can be described before
# Metal's. Apple targets take Metal, where the surface's colour space says it instead, so
# neither the Vulkan backend nor ash is compiled there at all.
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
# The version wgpu-hal already uses.
ash = { version = "0.38", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
# The view the game draws into, read back in UIKit's terms: the versions winit and wgpu use.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The versions winit already uses, with the color-management protocol (staging).
wayland-backend = { version = "0.3.10", default-features = false, features = ["client_system"] }
wayland-client = { version = "0.31.10", default-features = false }
wayland-protocols = { version = "0.32.8", default-features = false, features = ["client", "staging"] }

[lints]
workspace = true
