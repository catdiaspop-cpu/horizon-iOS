[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Scheduling hints for the game's threads and its allocator, and the other OS calls the crates that forbid unsafe code can't make"

[dependencies]
# The phone and desktop builds' allocator. iOS links no mimalloc: its C sources are built for a
# newer iOS than the binary targets (the SDK's newest, not ours) and call `___chkstk_darwin`, a
# stack-probe helper the platform's stubs at that version do not define, so the link failed with
# an undefined symbol. The system heap is the one Apple keeps tuned for the phone.
[target.'cfg(not(target_os = "ios"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[features]
# Counts live heap bytes by startup step and thread (`CensusAllocator`); for measuring only.
alloc-census = []

[lints]
workspace = true
